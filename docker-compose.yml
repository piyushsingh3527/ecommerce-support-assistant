services:
  db:
    image: pgvector/pgvector:pg18
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_support"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ecommerce-api
    env_file:
      - .env
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ecommerce_support
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/storage:/app/data/storage
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: